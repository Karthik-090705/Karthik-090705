<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 760" width="440" height="760">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#241b3d"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33e6d5"/>
      <stop offset="100%" stop-color="#0f9d94"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="photoClip">
      <circle cx="220" cy="360" r="66"/>
    </clipPath>
    <style>
      .assembly {
        transform-box: view-box;
        transform-origin: 220px 6px;
        animation: swing 4.2s ease-in-out infinite;
      }
      @keyframes swing {
        0%   { transform: rotate(-7deg); }
        50%  { transform: rotate(7deg); }
        100% { transform: rotate(-7deg); }
      }
      .card3d {
        transform-box: view-box;
        transform-origin: 220px 480px;
        animation: turn 4.2s ease-in-out infinite;
      }
      @keyframes turn {
        0%   { transform: scaleX(0.93) skewY(-1.1deg); }
        50%  { transform: scaleX(1.05) skewY(1.1deg); }
        100% { transform: scaleX(0.93) skewY(-1.1deg); }
      }
    </style>
  </defs>

  <g class="assembly">
    <!-- fixed clip/hook at the very top -->
    <rect x="203" y="0" width="34" height="16" rx="5" fill="#8a8f98"/>
    <rect x="203" y="0" width="34" height="6" rx="3" fill="#c7cbd1"/>

    <!-- lanyard strap -->
    <path d="M212,16 L212,192 L228,192 L228,16 Z" fill="url(#strapGrad)"/>
    <text x="220" y="120" text-anchor="middle" fill="#0b1620" font-family="'Courier New', monospace"
          font-size="11" font-weight="bold" transform="rotate(90 220 120)" letter-spacing="2">YOUR-USERNAME</text>

    <!-- metal card clip -->
    <circle cx="220" cy="200" r="11" fill="#d7dade" stroke="#8a8f98" stroke-width="2"/>
    <rect x="208" y="205" width="24" height="20" rx="5" fill="#d7dade" stroke="#8a8f98" stroke-width="2"/>

    <g class="card3d">
      <!-- card body -->
      <rect x="40" y="222" width="360" height="516" rx="26" fill="url(#cardGrad)"
            stroke="#39d6c8" stroke-width="2" filter="url(#cardShadow)"/>

      <!-- header -->
      <text x="220" y="268" text-anchor="middle" fill="#39d6c8" font-family="'Courier New', monospace"
            font-size="19" font-weight="bold" letter-spacing="3">DEVELOPER ID</text>
      <line x1="70" y1="284" x2="370" y2="284" stroke="#2a3546" stroke-width="1"/>

      <!-- photo -->
      <circle cx="220" cy="360" r="70" fill="#0b1018" stroke="#39d6c8" stroke-width="3"/>
      <!-- Replace the href below with your own avatar, e.g. https://github.com/YOUR_USERNAME.png -->
      <image href="https://github.com/github.png" x="154" y="294" width="132" height="132" clip-path="url(#photoClip)"/>

      <!-- name + title -->
      <text x="220" y="458" text-anchor="middle" fill="#ffffff" font-family="'Courier New', monospace"
            font-size="24" font-weight="bold">Sai Karthik</text>
      <text x="220" y="484" text-anchor="middle" fill="#9aa5b8" font-family="'Courier New', monospace"
            font-size="13">Full-Stack Developer &amp; AI Enthusiast</text>

      <line x1="70" y1="504" x2="370" y2="504" stroke="#2a3546" stroke-width="1"/>

      <!-- details -->
      <text x="70" y="534" fill="#5b6673" font-family="'Courier New', monospace" font-size="12">GITHUB</text>
      <text x="370" y="534" text-anchor="end" fill="#e6e6e6" font-family="'Courier New', monospace" font-size="13">@YOUR-USERNAME</text>

      <text x="70" y="560" fill="#5b6673" font-family="'Courier New', monospace" font-size="12">STACK</text>
      <text x="370" y="560" text-anchor="end" fill="#e6e6e6" font-family="'Courier New', monospace" font-size="13">React · FastAPI · PostgreSQL</text>

      <text x="70" y="586" fill="#5b6673" font-family="'Courier New', monospace" font-size="12">FOCUS</text>
      <text x="370" y="586" text-anchor="end" fill="#e6e6e6" font-family="'Courier New', monospace" font-size="13">AI / ML · Full-Stack</text>

      <text x="70" y="612" fill="#5b6673" font-family="'Courier New', monospace" font-size="12">STATUS</text>
      <text x="358" y="612" text-anchor="end" fill="#3ddc84" font-family="'Courier New', monospace" font-size="13">● AVAILABLE</text>

      <line x1="70" y1="630" x2="370" y2="630" stroke="#2a3546" stroke-width="1"/>

      <!-- barcode decoration -->
      <g transform="translate(70,700)" fill="#4b5566">
        <rect x="0"   y="0" width="3" height="24"/>
        <rect x="6"   y="0" width="1" height="24"/>
        <rect x="10"  y="0" width="4" height="24"/>
        <rect x="17"  y="0" width="2" height="24"/>
        <rect x="22"  y="0" width="1" height="24"/>
        <rect x="27"  y="0" width="5" height="24"/>
        <rect x="35"  y="0" width="2" height="24"/>
        <rect x="40"  y="0" width="1" height="24"/>
        <rect x="44"  y="0" width="3" height="24"/>
        <rect x="50"  y="0" width="1" height="24"/>
        <rect x="54"  y="0" width="4" height="24"/>
        <rect x="61"  y="0" width="2" height="24"/>
        <rect x="66"  y="0" width="1" height="24"/>
        <rect x="70"  y="0" width="5" height="24"/>
        <rect x="78"  y="0" width="2" height="24"/>
        <rect x="83"  y="0" width="1" height="24"/>
        <rect x="87"  y="0" width="3" height="24"/>
        <rect x="93"  y="0" width="1" height="24"/>
        <rect x="97"  y="0" width="4" height="24"/>
        <rect x="104" y="0" width="2" height="24"/>
        <rect x="109" y="0" width="1" height="24"/>
        <rect x="113" y="0" width="5" height="24"/>
        <rect x="121" y="0" width="2" height="24"/>
        <rect x="126" y="0" width="1" height="24"/>
        <rect x="130" y="0" width="3" height="24"/>
        <rect x="136" y="0" width="1" height="24"/>
        <rect x="140" y="0" width="4" height="24"/>
        <rect x="147" y="0" width="2" height="24"/>
        <rect x="152" y="0" width="1" height="24"/>
        <rect x="156" y="0" width="5" height="24"/>
        <rect x="164" y="0" width="2" height="24"/>
        <rect x="169" y="0" width="1" height="24"/>
        <rect x="173" y="0" width="3" height="24"/>
        <rect x="179" y="0" width="1" height="24"/>
        <rect x="183" y="0" width="4" height="24"/>
        <rect x="190" y="0" width="2" height="24"/>
        <rect x="195" y="0" width="1" height="24"/>
        <rect x="199" y="0" width="5" height="24"/>
        <rect x="207" y="0" width="2" height="24"/>
        <rect x="212" y="0" width="1" height="24"/>
        <rect x="216" y="0" width="3" height="24"/>
        <rect x="222" y="0" width="1" height="24"/>
        <rect x="226" y="0" width="4" height="24"/>
        <rect x="233" y="0" width="2" height="24"/>
        <rect x="238" y="0" width="1" height="24"/>
        <rect x="242" y="0" width="5" height="24"/>
        <rect x="250" y="0" width="2" height="24"/>
        <rect x="255" y="0" width="1" height="24"/>
        <rect x="259" y="0" width="3" height="24"/>
        <rect x="265" y="0" width="1" height="24"/>
        <rect x="269" y="0" width="4" height="24"/>
        <rect x="276" y="0" width="2" height="24"/>
        <rect x="281" y="0" width="1" height="24"/>
        <rect x="285" y="0" width="5" height="24"/>
        <rect x="293" y="0" width="2" height="24"/>
        <rect x="298" y="0" width="1" height="24"/>
        <rect x="302" y="0" width="3" height="24"/>
      </g>
    </g>
  </g>
</svg>
