<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <radialGradient id="glowPurple" cx="15%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#39d6c8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#39d6c8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="heroPhotoClip">
      <circle cx="680" cy="120" r="56"/>
    </clipPath>
    <style>
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .ring1 { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; }
      .ring2 { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; animation-delay: 1s; }
      .ring3 { transform-box: fill-box; transform-origin: center; animation: ping 3s ease-out infinite; animation-delay: 2s; }
      @keyframes ping {
        0%   { transform: scale(1);    opacity: 0.55; }
        100% { transform: scale(1.35); opacity: 0; }
      }
    </style>
  </defs>

  <!-- outer card -->
  <rect x="1" y="1" width="898" height="298" rx="20" fill="#0e1424" stroke="#232c3d" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="298" rx="20" fill="url(#glowPurple)"/>
  <rect x="1" y="1" width="898" height="298" rx="20" fill="url(#glowTeal)"/>

  <!-- ============= LEFT: terminal panel ============= -->
  <rect x="30" y="30" width="430" height="210" rx="14" fill="#111827" stroke="#2a3546" stroke-width="1"/>
  <circle cx="50" cy="48" r="5.5" fill="#ff5f57"/>
  <circle cx="68" cy="48" r="5.5" fill="#febc2e"/>
  <circle cx="86" cy="48" r="5.5" fill="#28c840"/>
  <text x="440" y="52" text-anchor="end" fill="#5b6673" font-family="'Courier New', monospace" font-size="11">saikarthik@dev-machine: ~</text>

  <text x="48" y="92" font-family="'Courier New', monospace" font-size="15">
    <tspan fill="#3ddc84">→</tspan>
    <tspan fill="#9aa5b8"> ~/portfolio </tspan>
    <tspan fill="#ffffff" font-weight="bold">whoami</tspan>
  </text>

  <text x="48" y="124" font-family="'Courier New', monospace" font-size="23" font-weight="bold" fill="#ff5db1">Sai Karthik</text>
  <rect class="cursor" x="220" y="108" width="10" height="20" fill="#ff5db1"/>

  <text x="48" y="150" font-family="'Courier New', monospace" font-size="13" fill="#9aa5b8">Full-Stack Developer &amp; AI Enthusiast</text>

  <text x="48" y="178" font-family="'Courier New', monospace" font-size="12">
    <tspan fill="#3ddc84">$</tspan>
    <tspan fill="#39d6c8"> echo </tspan>
    <tspan fill="#39d6c8">$MOTTO</tspan>
  </text>
  <text x="48" y="200" font-family="'Courier New', monospace" font-size="11" font-style="italic" fill="#39d6c8">"Code. Build. Repeat. • Transforming Ideas into Reality"</text>

  <!-- tag pills -->
  <g font-family="'Courier New', monospace" font-size="11" font-weight="bold">
    <rect x="48"  y="212" width="62" height="22" rx="11" fill="none" stroke="#39d6c8" stroke-width="1.2"/>
    <text x="79"  y="227" text-anchor="middle" fill="#39d6c8">REACT</text>

    <rect x="118" y="212" width="76" height="22" rx="11" fill="none" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="156" y="227" text-anchor="middle" fill="#7dd3fc">FASTAPI</text>

    <rect x="202" y="212" width="70" height="22" rx="11" fill="none" stroke="#facc15" stroke-width="1.2"/>
    <text x="237" y="227" text-anchor="middle" fill="#facc15">PYTHON</text>

    <rect x="280" y="212" width="92" height="22" rx="11" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="326" y="227" text-anchor="middle" fill="#a78bfa">POSTGRES</text>

    <rect x="380" y="212" width="72" height="22" rx="11" fill="none" stroke="#f472b6" stroke-width="1.2"/>
    <text x="416" y="227" text-anchor="middle" fill="#f472b6">TWILIO</text>
  </g>

  <!-- ============= RIGHT: photo panel ============= -->
  <rect x="490" y="30" width="380" height="210" rx="14" fill="#111827" stroke="#39d6c8" stroke-width="1.2"/>

  <circle class="ring1" cx="680" cy="120" r="70" fill="none" stroke="#39d6c8" stroke-width="1"/>
  <circle class="ring2" cx="680" cy="120" r="70" fill="none" stroke="#39d6c8" stroke-width="1"/>
  <circle class="ring3" cx="680" cy="120" r="70" fill="none" stroke="#39d6c8" stroke-width="1"/>

  <circle cx="680" cy="120" r="58" fill="#0b1018" stroke="#39d6c8" stroke-width="2"/>
  <!-- Replace the href below with your own photo/avatar -->
  <image href="https://github.com/github.png" x="624" y="64" width="112" height="112" clip-path="url(#heroPhotoClip)"/>

  <text x="680" y="212" text-anchor="middle" fill="#39d6c8" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2">FULL-STACK DEVELOPER</text>

  <!-- ============= divider ============= -->
  <line x1="30" y1="255" x2="870" y2="255" stroke="#1fd1c1" stroke-opacity="0.45" stroke-width="1"/>

  <!-- ============= bottom row ============= -->
  <text x="30" y="276" fill="#5b6673" font-family="'Courier New', monospace" font-size="11">SQL · Java · PHP</text>
  <text x="870" y="276" text-anchor="end" fill="#5b6673" font-family="'Courier New', monospace" font-size="11">GitHub · @YOUR-USERNAME · YOUR-EMAIL@example.com</text>
</svg>
